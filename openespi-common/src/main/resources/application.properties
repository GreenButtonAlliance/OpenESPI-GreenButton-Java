# Spring Boot 3.5 Default Configuration for OpenESPI-Common
# Copyright (c) 2018-2026 Green Button Alliance, Inc.

# Default Profile Configuration
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev-mysql}

# No spring.application.name here: this file ships inside the jar and, being .properties, would
# override the name each application sets in its own application.yml (it tagged every DC/TP metric
# application="OpenESPI-Common").

# Default Database Configuration (overridden by profiles)
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# Default JPA Configuration
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Default Jackson Configuration
spring.jackson.default-property-inclusion=non_null
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

# No management.* settings here: this file ships inside the OpenESPI-Common jar and is loaded by
# every application that depends on it. Each application owns its actuator configuration.

# ESPI Default Configuration
espi.version=1.0
espi.namespace.usage=urn:uuid:espi:usage
espi.namespace.customer=urn:uuid:espi:customer

# Green Button Alliance Certification Configuration
# Set certified=true and provide certification-id when application is GBA certified
greenbutton.certified=false
greenbutton.certification-id=
greenbutton.certification-base-url=https://cert.greenbuttonalliance.org/certificate/

# Default Logging Configuration
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n