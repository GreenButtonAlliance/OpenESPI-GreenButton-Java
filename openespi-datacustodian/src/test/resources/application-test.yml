# Test Configuration
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        generate_statistics: false
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations:
      - classpath:db/migration
      - classpath:db/vendor/h2
  
  security:
    oauth2:
      resourceserver:
        opaquetoken:
          introspection-uri: http://localhost:8080/oauth2/introspect
          client-id: datacustodian
          client-secret: datacustodian-secret

logging:
  level:
    org.greenbuttonalliance.espi: DEBUG
    org.springframework.security: WARN
    org.hibernate: WARN
    org.flywaydb: INFO

espi:
  datacustodian:
    base-url: http://localhost:8081/DataCustodian
  authorization-server:
    issuer-uri: http://localhost:8080
    introspection-endpoint: http://localhost:8080/oauth2/introspect
    client-id: datacustodian
    client-secret: datacustodian-secret
