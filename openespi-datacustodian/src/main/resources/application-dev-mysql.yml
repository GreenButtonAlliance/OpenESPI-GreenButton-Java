# Development MySQL Profile Configuration
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/datacustodian?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DATABASE_USERNAME:espi}
    password: ${DATABASE_PASSWORD:espi123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      pool-name: DataCustodianHikariCP
      auto-commit: false
      connection-test-query: SELECT 1
  
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        generate_statistics: true
        
  flyway:
    # Common ships shared migrations at classpath:db/migration (V1, V3, plus handoff's V4)
    # and vendor-specific migrations at classpath:db/vendor/<vendor> (V2 — retail_customers etc).
    # DC needs both locations. The previous "classpath:db/migration/mysql" pointed at a path that
    # didn't exist on any module's classpath, so Flyway silently found 0 migrations and JPA blew up
    # later on missing tables.
    locations: classpath:db/migration,classpath:db/vendor/mysql
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}

# Development-specific logging
logging:
  level:
    org.greenbuttonalliance.espi: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  
server:
  port: 8081

espi:
  datacustodian:
    base-url: http://localhost:8081/DataCustodian
  authorization-server:
    # Local sandbox AS runs on :9999. Opaque-token introspection (ESPI standard) points here;
    # client-id/secret default to datacustodian/datacustodian-secret (seeded on the AS).
    issuer-uri: http://localhost:9999
    introspection-endpoint: http://localhost:9999/oauth2/introspect
    jwk-set-uri: http://localhost:9999/.well-known/jwks.json  # unused (opaque tokens; no JWT/JWK)