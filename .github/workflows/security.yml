name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1' # weekly, Monday 05:17 UTC (new CVEs appear without code changes)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-check:
    name: OWASP dependency-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-java-maven

      # The NVD database is ~GBs to build from scratch; keep it between runs (refreshed weekly).
      - name: Cache NVD data
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-

      # The aggregate goal resolves every module's dependencies, so the inter-module SNAPSHOT
      # artifacts must be in ~/.m2 first.
      - name: Install modules (no tests)
        run: mvn install -DskipTests

      # ADVISORY until #131 is cleared, and visibly so: the step fails on any dependency with CVSS 8
      # or higher, or when it cannot run at all (an NVD outage, say). continue-on-error keeps that
      # from blocking a PR, and the next step turns it into a warning on the run instead of a silent
      # pass. To make it a gate: remove continue-on-error and the warning step.
      #
      # NVD_API_KEY is REQUIRED (free from NIST): dependency-check 13 cannot download the NVD data
      # without one. It is read through nvdApiKeyEnvironmentVariable, never passed as -DnvdApiKey,
      # which puts it on Maven's command line where debug logging can expose it (GHSA-qqhq-8r2c-c3f5).
      # Runs that get no secrets (Dependabot, fork PRs) end in the warning below.
      #
      # Analyzers: OSS Index now requires Sonatype credentials, so it is off. RetireJS stays on: it
      # scans the JavaScript bundled in webjars (it found DOMPurify inside swagger-ui, #131). No Node
      # manifest is tracked, so the Node analyzer is off.
      - name: Run dependency-check (aggregate)
        id: owasp
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >-
          mvn org.owasp:dependency-check-maven:aggregate
          -DfailBuildOnCVSS=8
          -Dformats=HTML,JSON,SARIF
          -DsuppressionFile=.github/dependency-check-suppressions.xml
          -DossIndexAnalyzerEnabled=false
          -DnodeAnalyzerEnabled=false
          -DskipSystemScope=true
          -DnvdApiKeyEnvironmentVariable=NVD_API_KEY

      - name: Report the advisory result
        if: steps.owasp.outcome == 'failure'
        run: >-
          echo "::warning title=OWASP dependency-check::Found a dependency with CVSS 8 or higher, or
          could not run. See the dependency-check-report artifact and the step log."

      # A plain dependency listing stays useful when the check above cannot reach the NVD.
      - name: Record dependency tree
        if: always()
        run: mvn dependency:tree > dependency-tree.txt

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.*
            dependency-tree.txt
          if-no-files-found: ignore
          retention-days: 30

  codeql:
    name: CodeQL (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Fork PRs cannot upload results (no security-events: write on their token).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      # build-mode: none extracts Java without compiling, so it is independent of the JDK 25
      # toolchain and needs no Maven build.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
