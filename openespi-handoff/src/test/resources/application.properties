# Standalone test configuration for openespi-handoff.
# Production consumers (openespi-common → openespi-datacustodian; openespi-authserver) supply
# their own datasource configuration; this file applies only to the module's @DataJpaTest.
spring.datasource.url=jdbc:h2:mem:handofftest;DB_CLOSE_DELAY=-1;MODE=LEGACY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
