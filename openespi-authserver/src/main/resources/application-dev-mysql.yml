# Development MySQL Profile Configuration
# OpenESPI Authorization Server - MySQL Development Environment

spring:
  # MySQL Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/oauth2_authserver?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:openespi_user}
    password: ${DB_PASSWORD:openespi_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      # auto-commit must be true: JdbcRegisteredClientRepository.save() and other
      # repository methods do not declare @Transactional, so without auto-commit
      # their INSERTs are never committed and silently roll back when the
      # connection returns to the pool. Architectural cleanup tracked separately.
      auto-commit: true
  
  # JPA/Hibernate Configuration for MySQL
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        connection:
          characterEncoding: utf8
          CharSet: utf8
          useUnicode: true
  
  # Flyway Migration for MySQL
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/vendor/mysql
    schemas: oauth2_authserver
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    url: ${spring.datasource.url}
    # Apply through V7.0.0 (handoff_nonces, added in #122 PR C3.4 — required by AS).
    # Original cap was V2.0.0 (issue #123 schema repair concern), but C3/C4 introduce a
    # structural V7 that AS's JPA layer validates against at startup. V3 (seed/test-client
    # data) and V4-V6 (datacustodian_integration_mapping, oauth2_user_info, certificate auth)
    # are applied along the way; V4-V6 are largely vestigial after the OIDC/JWK strip but
    # their CREATE TABLEs are harmless. If V3 fails to apply against the post-#123 schema
    # we'll surface the specific INSERT error rather than silently skipping.
    target: "7.0.0"

# Development Logging
logging:
  level:
    org.springframework.security.oauth2: DEBUG
    org.greenbuttonalliance.espi: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    com.mysql: INFO
  file:
    name: logs/authserver-dev-mysql.log

# Development Server Configuration
server:
  error:
    include-stacktrace: always
    include-message: always

# OAuth2 Development Settings
espi:
  oauth2:
    # Development clients (will be moved to database)
    clients:
      datacustodian:
        client-id: data_custodian_admin
        client-secret: dev_secret_dc
        base-url: http://localhost:8080
      thirdparty:
        client-id: third_party
        client-secret: dev_secret_tp  
        base-url: http://localhost:9090
    # JWT Development Settings
    jwt:
      access-token-validity: PT6H    # 6 hours
      refresh-token-validity: PT24H  # 24 hours