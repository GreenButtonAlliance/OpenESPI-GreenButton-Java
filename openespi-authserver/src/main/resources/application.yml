# OpenESPI Authorization Server Configuration
# Spring Boot 3.5 OAuth2 Authorization Server

server:
  port: 9999
  servlet:
    context-path: /
  ssl:
    enabled: false

spring:
  application:
    name: openespi-authorization-server

  # ESPI is opaque-token only — suppress the Spring Boot auto-config that would
  # otherwise generate a JWKSource/JwtDecoder and stand up /oauth2/jwks (#134).
  autoconfigure:
    exclude:
      - org.springframework.boot.security.oauth2.server.authorization.autoconfigure.servlet.OAuth2AuthorizationServerJwtAutoConfiguration

  profiles:
    active: dev-mysql

  # Security Configuration
  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:9999
        endpoint:
          authorization-uri: /oauth2/authorize
          token-uri: /oauth2/token
          token-revocation-uri: /oauth2/revoke
          token-introspection-uri: /oauth2/introspect
  
  # Thymeleaf Configuration for OAuth2 consent pages
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    
  # JPA Configuration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC
  
  # Flyway Database Migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/vendor/h2
    #schemas: oauth2_authserver
  jackson:
    default-property-inclusion: non_null

    datatype:
      datetime:
        write-dates-as-timestamps: false

    serialization:
      write_empty_json_arrays: true
    deserialization:
      fail_on_unknown_properties: false
# Logging Configuration
logging:
  level:
    org.springframework.security: INFO
    org.springframework.security.oauth2: INFO
    org.springframework.security.oauth2.server.authorization: DEBUG
    org.greenbuttonalliance.espi: DEBUG
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Management Endpoints
# Endpoint access is opt-in and read-only. Only health (status only, plus the liveness/readiness
# probe groups) is anonymous; every other endpoint needs an authserver.admin bearer token
# (AuthorizationServerConfig#actuatorSecurityFilterChain). env is deliberately not exposed.
management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
    info:
      access: read-only
    metrics:
      access: read-only

# ESPI Configuration
espi:
  # Token format: opaque (ESPI standard) or jwt (experimental)
  token:
    format: opaque  # Default to ESPI-compliant opaque tokens
  datacustodian:
    endpoint: http://localhost:8080
    # Base URL of the Data Custodian — used by AuthorizeDelegateController to redirect the
    # customer to DC's /oauth/authorize-screen for login + consent. MUST be reachable from the
    # customer's browser, not just from the AS server (it's a 302 target).
    baseUrl: ${DATACUSTODIAN_BASE_URL:http://localhost:8081/DataCustodian}

  # Shared HMAC key for the AS↔DC signed-handoff (user-flow redirect parameter).
  # MUST be at least 32 chars of high-entropy material AND identical to the value configured on
  # the Data Custodian (the AS produces signatures the DC verifies, and vice versa). Set via
  # ESPI_HANDOFF_SIGNING_KEY env var in production.
  handoff:
    signing-key: ${ESPI_HANDOFF_SIGNING_KEY:dev-only-handoff-signing-key-change-me}

  # AS→DC back-channel (server-to-server) used at /oauth2/token mint time to provision the
  # Authorization aggregate + Subscriptions and retrieve canonical resource URIs. Credentials
  # MUST match the values DC's BackchannelSecurityConfiguration expects on espi.backchannel.*.
  # Endpoint MUST be reachable from the AS server (not necessarily from the browser).
  backchannel:
    endpoint: ${DATACUSTODIAN_BACKCHANNEL_ENDPOINT:http://localhost:8081/DataCustodian}
    client-id: ${ESPI_BACKCHANNEL_CLIENT_ID:as-backchannel}
    client-secret: ${ESPI_BACKCHANNEL_CLIENT_SECRET:change-me-in-production}

  authserver:
    # Scheduled purge of fully-expired oauth2_authorization rows, with one AUTHORIZATION_PURGED
    # audit row per purge in oauth2_audit_log (#192). Values shown are the defaults; see
    # DEPLOYMENT_GUIDE.md "Authorization Purge and Audit Retention".
    authorization-purge:
      enabled: true
      interval: 1h          # delay between runs
      initial-delay: 5m     # delay before the first run after startup
      grace-period: 7d      # keep rows this long after their latest token expiry
      batch-size: 500       # rows per transaction
      audit-retention: 395d # keep purge audit rows ~13 months; extend to regulatory requirement
    # RFC 7591 dynamic client registration (POST /oauth2/register, #196). The espi_registrar client
    # obtains the single-use client.create initial access token via client_credentials. Its secret is
    # stored bcrypt-encoded; leave unset to keep dynamic registration disabled (registrar not seeded).
    registrar:
      client-secret: ${ESPI_REGISTRAR_CLIENT_SECRET:}

# Application Information
info:
  app:
    name: OpenESPI Authorization Server
    description: Green Button Alliance OAuth2 Authorization Server
    version: 1.0.0-SNAPSHOT
    spring-boot-version: 3.5.0
    java-version: 17
    espi:
      token-format: opaque
      compliance: ESPI 1.1 Standard