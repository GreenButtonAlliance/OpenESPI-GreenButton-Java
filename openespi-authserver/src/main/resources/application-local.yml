# Local Development Profile Configuration
# OpenESPI Authorization Server - H2 In-Memory Database

spring:
  # H2 In-Memory Database Configuration
  datasource:
    url: jdbc:h2:mem:oauth2_authserver;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 2
  
  # H2 Console for Development
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  
  # JPA/Hibernate Configuration for H2
  # Flyway (db/vendor/h2) owns the schema; Hibernate only validates it. The dialect must be set via
  # properties.hibernate.dialect, because application.yml sets MySQLDialect there and that key
  # takes precedence over spring.jpa.database-platform.
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        jdbc:
          time_zone: UTC
  
  # Flyway Configuration for H2 (default PUBLIC schema, which is what the JDBC repositories query)
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/vendor/h2

# Local Development Logging
logging:
  level:
    org.springframework.security.oauth2: DEBUG
    org.greenbuttonalliance.espi: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    com.h2database: INFO
  file:
    name: logs/authserver-local.log

# Local Server Configuration
server:
  error:
    include-stacktrace: always
    include-message: always

# OAuth2 Local Development Settings
espi:
  oauth2:
    # Local development clients
    clients:
      datacustodian:
        client-id: data_custodian_admin
        client-secret: local_secret_dc
        base-url: http://localhost:8080
      thirdparty:
        client-id: third_party
        client-secret: local_secret_tp
        base-url: http://localhost:9090
    # JWT Local Settings
    jwt:
      access-token-validity: PT1H     # 1 hour for testing
      refresh-token-validity: PT6H    # 6 hours for testing

# Seed the demo OAuth clients (well-known secrets; never in production).
espi.authserver.seed.demo-clients: true

# ---- Local manual-test kit (#254). DEV ONLY: every value below is published in this repository. ----
# AS admin console login admin / admin (bcrypt of "admin"); a passkey is enrolled at first login.
# Environment variables still win, so a developer can use their own.
espi.authserver.admin.bootstrap.username: ${ESPI_BOOTSTRAP_ADMIN_USERNAME:admin}
espi.authserver.admin.bootstrap.password-hash: ${ESPI_BOOTSTRAP_ADMIN_PASSWORD_HASH:$2a$10$lBNJLX4/6hEqECVzSTxCqeOM3Ve.w3FxG2F2y.KeN8kkS9Y/0/f6e}
# espi_admin (authserver.admin bearer access) and espi_registrar (RFC 7591 initial access tokens)
espi.authserver.admin-client.secret: ${ESPI_ADMIN_CLIENT_SECRET:local-admin-secret}
espi.authserver.registrar.client-secret: ${ESPI_REGISTRAR_CLIENT_SECRET:local-registrar-secret}
# third_party redirect URIs = the local Third Party's Spring OAuth2 client callbacks
espi.authserver.seed.third-party.redirect-uris: >-
  http://localhost:8082/ThirdParty/login/oauth2/code/datacustodian-monthly,
  http://localhost:8082/ThirdParty/login/oauth2/code/datacustodian-daily
