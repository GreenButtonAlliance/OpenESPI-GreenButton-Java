# OpenESPI Authorization Server Test Configuration
# Test profile for unit and integration testing

server:
  port: 0  # Random port for tests

spring:
  application:
    name: openespi-authorization-server-test
  
  # H2 In-Memory Database for Tests
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1200000
  
  # JPA Configuration for Tests
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        use_sql_comments: true
        show_sql: true
        jdbc:
          batch_size: 20
    open-in-view: false

  #    enabled: false
  
  # Security Configuration for Tests
  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:9999

# ESPI Configuration for Tests
espi:
  token:
    format: opaque  # Test with ESPI-compliant opaque tokens
  datacustodian:
    endpoint: http://localhost:8080

# Logging Configuration for Tests
logging:
  level:
    org.springframework.security.oauth2: DEBUG
    org.greenbuttonalliance.espi: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Management Endpoints for Tests
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always