# Test Configuration
spring:
  datasource:
    # One in-memory database per Spring test context, so contexts never share or recreate each
    # other's tables. Same H2 settings as the openespi-common tests. The `local` profile adds
    # DATABASE_TO_LOWER and CASE_INSENSITIVE_IDENTIFIERS; LocalProfileSchemaTest runs on its exact URL.
    url: jdbc:h2:mem:tp-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # Flyway owns the schema (#267), as in every application profile: the openespi-common scripts
  # create it and Hibernate only validates it, so entity/script drift fails every Spring test.
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        generate_statistics: false

  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/vendor/h2,classpath:db/thirdparty/h2

  security:
    oauth2:
      client:
        registration:
          datacustodian:
            client-id: test-client
            client-secret: test-secret
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:8082/ThirdParty/login/oauth2/code/datacustodian"
            scope: "FB=4_5_15"
        provider:
          datacustodian:
            authorization-uri: http://localhost:9999/oauth2/authorize
            token-uri: http://localhost:9999/oauth2/token

logging:
  level:
    org.greenbuttonalliance.espi: DEBUG
    org.springframework.security: WARN
    org.springframework.oauth2: WARN
    org.hibernate: WARN
    org.flywaydb: WARN

espi:
  thirdparty:
    base-url: http://localhost:8082/ThirdParty
  datacustodian:
    base-url: http://localhost:8081/DataCustodian
  authorization-server:
    issuer-uri: http://localhost:9999
    authorization-endpoint: http://localhost:9999/oauth2/authorize
    token-endpoint: http://localhost:9999/oauth2/token