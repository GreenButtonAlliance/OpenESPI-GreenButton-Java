# Local Development H2 Profile Configuration
# Fast startup for local development and testing
spring:
  datasource:
    url: jdbc:h2:mem:thirdparty;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      pool-name: ThirdPartyH2HikariCP
      auto-commit: false
      connection-test-query: SELECT 1
  
  # Flyway creates the schema from the openespi-common scripts (H2 vendor folder); Hibernate only
  # validates it (ddl-auto: validate, from application.yml), as on MySQL and PostgreSQL (#267).
  # Naming comes from openespi-common's application.properties (PhysicalNamingStrategyStandardImpl),
  # as on every other profile; no local override.
  jpa:
    show-sql: true
    properties:
      hibernate:
        generate_statistics: true
        format_sql: true

  flyway:
    locations: classpath:db/migration,classpath:db/vendor/h2

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        # Localhost only. H2ConsoleSecurityConfiguration also requires a signed-in TP administrator
        # and a same-origin or user-initiated request (Sec-Fetch-Site).
        web-allow-others: false

# Development-specific logging
logging:
  level:
    org.greenbuttonalliance.espi: DEBUG
    org.springframework.security: DEBUG
    org.springframework.oauth2: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate.mapping: TRACE
    org.hibernate.boot: TRACE
    org.springframework.orm.jpa: TRACE
    org.h2.server: INFO
  
server:
  port: 8082
  # Loopback only. local is the default profile and seeds published DEV ONLY accounts (admin/admin
  # with ROLE_CUSTODIAN, customer/customer) and the H2 console, so a deployment that forgets
  # SPRING_PROFILES_ACTIVE must not serve them to the network (#267). To reach the TP from another
  # machine or from outside a container, use dev-mysql or dev-postgresql.
  address: 127.0.0.1

espi:
  thirdparty:
    base-url: http://localhost:8082/ThirdParty
  datacustodian:
    base-url: http://localhost:8081/DataCustodian
  authorization-server:
    issuer-uri: http://localhost:9999
    authorization-endpoint: http://localhost:9999/oauth2/authorize
    token-endpoint: http://localhost:9999/oauth2/token
    client-id: third_party
    # Must match the AS's seeded dev client (AuthorizationServerConfig: {noop}tp-secret); used to
    # introspect actuator admin tokens.
    client-secret: tp-secret

# OAuth2 client registrations aligned with the AS's local third_party seed (#254, configuration part of
# #146): same client id and secret, redirect URIs the AS registers on the local profile, and the exact
# ESPI scopes the AS allows. No openid/profile: the AS issues opaque ESPI tokens only.
# HistoryLength is in seconds (REQ.21.6.1.2.1): 34128000 = 395 days.
spring.security.oauth2.client.registration.datacustodian-monthly.client-secret: tp-secret
spring.security.oauth2.client.registration.datacustodian-monthly.scope: "FB=4_5_15;IntervalDuration=3600;BlockDuration=monthly;HistoryLength=34128000"
spring.security.oauth2.client.registration.datacustodian-daily.client-secret: tp-secret
spring.security.oauth2.client.registration.datacustodian-daily.scope: "FB=4_5_15;IntervalDuration=900;BlockDuration=monthly;HistoryLength=34128000"
# The ESPI client access token (Authorization and Bulk APIs) is client_credentials, never customer consent.
spring.security.oauth2.client.registration.datacustodian-admin.client-secret: tp-secret
spring.security.oauth2.client.registration.datacustodian-admin.authorization-grant-type: client_credentials
spring.security.oauth2.client.registration.datacustodian-admin.scope: "FB=34_35"
