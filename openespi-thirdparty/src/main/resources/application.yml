# OpenESPI Third Party (OAuth2 Client) Application Configuration
# Spring Boot 3.5 configuration with multi-environment support

spring:
  application:
    name: OpenESPI-ThirdParty
  
  # Profiles: local (in-memory H2, the default, needs no database server), dev-mysql, dev-postgresql.
  # Choose with -Dspring-boot.run.profiles=<name> or SPRING_PROFILES_ACTIVE=<name>.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # JPA Configuration. Flyway owns the schema in every profile (#267); Hibernate only validates it,
  # so a mismatch between the entities and the openespi-common scripts stops the application.
  # The dialect is detected from the database.
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        generate_statistics: false
        cache:
          use_second_level_cache: false
          use_query_cache: false
  
  # Flyway Database Migration: the ESPI schema scripts shipped in openespi-common, as in the Data
  # Custodian. db/migration holds the shared versions (V1, V3, V5); db/vendor/<vendor> holds V2.
  # Each profile sets its vendor folder; MySQL is the fallback. V4 (the Data Custodian's handoff
  # nonces, from openespi-handoff) is not used by the Third Party, so its absence is expected.
  flyway:
    enabled: true
    # No baselining: no Third Party database was ever built by Flyway (before #267 Hibernate built
    # it), so marking an existing one as "already at V1" is never right. Flyway stops with a clear
    # error instead; drop and recreate such a database once (see the README).
    baseline-on-migrate: false
    locations: classpath:db/migration,classpath:db/vendor/mysql
    table: flyway_schema_history
  
  # Jackson JSON Configuration
  jackson:
    serialization:
      # write-dates-as-timestamps removed: not a SerializationFeature in Jackson 3 (Spring Boot 4);
      # date/time-as-timestamp handling moved to the Jackson 3 DateTime features.
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: NON_NULL
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSXXX
  
  # Cache Configuration
  cache:
    type: simple
    cache-names:
      - espi-resources
      - espi-usage-points
      - espi-authorizations
  
  # Thymeleaf Configuration
  thymeleaf:
    cache: false # Set to true in production
    check-template: true
    check-template-location: true
    encoding: UTF-8
    mode: HTML
    prefix: classpath:/templates/
    suffix: .html
    servlet:
      content-type: text/html
      produce-partial-output-while-processing: true

  # Web Configuration
  web:
    resources:
      add-mappings: true
      static-locations: classpath:/static/
      cache:
        period: 3600s
  
  # MVC Configuration  
  mvc:
    view:
      prefix: classpath:/templates/
      suffix: .html
    static-path-pattern: /**

  # OAuth2 Client Configuration - ESPI Third Party (#146). Spring Security's oauth2Client (not
  # oauth2Login): a signed-in TP customer authorizes the TP at the Data Custodian, and the tokens are
  # stored in the TP's ESPI authorizations table. ESPI scopes only: the AS issues opaque ESPI tokens,
  # never OpenID Connect ones (#134), so no openid/profile and no user-info endpoint.
  security:
    oauth2:
      client:
        registration:
          # Monthly usage data with 1-hour intervals (a customer's authorization, authorization_code)
          datacustodian-monthly:
            client-id: ${OAUTH2_CLIENT_ID:third_party}
            client-secret: ${OAUTH2_CLIENT_SECRET:secret}
            authorization-grant-type: authorization_code
            redirect-uri: "${espi.thirdparty.base-url}/login/oauth2/code/datacustodian-monthly"
            # HistoryLength is in seconds (REQ.21.6.1.2.1): 34128000 = 395 days, 604800 = 7 days.
            scope: "FB=4_5_15_17;IntervalDuration=3600;BlockDuration=monthly;HistoryLength=34128000"
            client-name: Data Custodian (Monthly)
            provider: datacustodian

          # Daily usage data with 15-minute intervals (a customer's authorization, authorization_code)
          datacustodian-daily:
            client-id: ${OAUTH2_CLIENT_ID:third_party}
            client-secret: ${OAUTH2_CLIENT_SECRET:secret}
            authorization-grant-type: authorization_code
            redirect-uri: "${espi.thirdparty.base-url}/login/oauth2/code/datacustodian-daily"
            scope: "FB=4_5_15_17;IntervalDuration=900;BlockDuration=daily;HistoryLength=604800"
            client-name: Data Custodian (Daily)
            provider: datacustodian

          # The TP's ESPI client access token (client_credentials, never customer consent): the only TP
          # token the Data Custodian's Authorization and Bulk APIs accept.
          datacustodian-admin:
            client-id: ${OAUTH2_CLIENT_ID:third_party}
            client-secret: ${OAUTH2_CLIENT_SECRET:secret}
            authorization-grant-type: client_credentials
            scope: "FB=34_35"
            client-name: Data Custodian (Client Access)
            provider: datacustodian

        provider:
          datacustodian:
            authorization-uri: ${OAUTH2_AUTHORIZATION_URI:http://localhost:9999/oauth2/authorize}
            token-uri: ${OAUTH2_TOKEN_URI:http://localhost:9999/oauth2/token}

# Server Configuration  
server:
  port: 8082
  servlet:
    context-path: /ThirdParty
    session:
      cookie:
        # Every profile, not left to browser defaults: cross-site POSTs carry no session cookie.
        # Not Strict: the redirect back from the Authorization Server (a cross-site top-level GET)
        # must carry the session, or Data Custodian authorization fails.
        same-site: lax
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/atom+xml
  error:
    include-stacktrace: never
    include-message: always

# Actuator Configuration
# Endpoint access is opt-in and read-only. Only health (status only, plus the liveness/readiness
# probe groups) is anonymous; every other endpoint needs an admin access token, validated by
# introspection at the Authorization Server (ActuatorSecurityConfiguration, espi.actuator).
management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
    info:
      access: read-only
    metrics:
      access: read-only
    prometheus:
      access: read-only
  metrics:
    tags:
      application: ${spring.application.name}

# ESPI Third Party Configuration
espi:
  thirdparty:
    # XSD validation of a fetched Batch/Subscription feed (atom.xsd, espi.xsd, customer.xsd):
    #   off     - not validated
    #   report  - validated; the issues are listed but the data is still shown and saved (default)
    #   enforce - a feed that fails validation is not shown (a Data Custodian that emits invalid XML,
    #             e.g. the non-numeric ServiceCategory kind of #278, is refused)
    xml-validation: report
    base-url: ${THIRDPARTY_BASE_URL:http://localhost:8082/ThirdParty}
    name: "Green Button Alliance Third Party"
    description: "NAESB ESPI 1.0 Third Party Client Implementation"
    contact:
      name: "Green Button Alliance"
      url: "https://www.greenbuttonalliance.org"
      email: "info@greenbuttonalliance.org"
  
  datacustodian:
    base-url: ${DATACUSTODIAN_BASE_URL:http://localhost:8081/DataCustodian}
  
  authorization-server:
    issuer-uri: ${AUTHORIZATION_SERVER_ISSUER_URI:http://localhost:9999}
    authorization-endpoint: ${AUTHORIZATION_SERVER_AUTHORIZATION_ENDPOINT:http://localhost:9999/oauth2/authorize}
    token-endpoint: ${AUTHORIZATION_SERVER_TOKEN_ENDPOINT:http://localhost:9999/oauth2/token}
    client-id: ${AUTHORIZATION_SERVER_CLIENT_ID:third_party}
    client-secret: ${AUTHORIZATION_SERVER_CLIENT_SECRET:secret}
    introspection-endpoint: ${AUTHORIZATION_SERVER_INTROSPECTION_ENDPOINT:http://localhost:9999/oauth2/introspect}

  # Admin-only actuator endpoints (everything except health): bearer tokens are introspected at
  # the Authorization Server with the client credentials above and must carry this scope.
  actuator:
    admin-scope: ${ESPI_THIRDPARTY_ACTUATOR_ADMIN_SCOPE:ThirdParty_Admin_Access}
  
  # ESPI Resource Configuration
  resources:
    base-uri: ${espi.datacustodian.base-url}/espi/1_1/resource
    page-size: 50
    max-page-size: 200
    
  # XML Processing Configuration
  xml:
    pretty-print: true
    include-namespaces: true

# Logging Configuration
logging:
  level:
    org.greenbuttonalliance.espi: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.springframework.oauth2: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json