<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title})}">
    <title>Error - Third Party - Green Button Alliance</title>
</head>
<body data-gba-app="thirdparty">

<nav th:replace="~{fragments/layout :: header}"></nav>

<main class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-8 col-lg-6 text-center">
            <i class="bi bi-exclamation-triangle text-danger" style="font-size: 5rem;"></i>
            <h1 class="mt-3 gba-section-title" th:text="${status} ?: 'Error'">Error</h1>
            <p class="lead text-muted" th:text="${error} ?: 'An unexpected error occurred'">
                An unexpected error occurred
            </p>

            <div class="mt-4" th:if="${message}">
                <div class="alert alert-danger" role="alert">
                    <strong>Error Details:</strong>
                    <span th:text="${message}"></span>
                </div>
            </div>

            <div class="mt-4 d-flex gap-2 justify-content-center">
                <a th:href="@{/}" class="btn btn-primary">
                    <i class="bi bi-house"></i>
                    Return to Home
                </a>
                <button type="button" onclick="history.back()" class="btn btn-outline-primary">
                    <i class="bi bi-arrow-left"></i>
                    Go Back
                </button>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
