<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title})}">
    <title>Login - Third Party - Green Button Alliance</title>
</head>
<body data-gba-app="thirdparty">

<nav th:replace="~{fragments/layout :: header}"></nav>

<main class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 col-lg-5">
            <section class="card">
                <div class="gba-card-header"><h2>Login to Third Party</h2></div>
                <div class="card-body p-4 p-lg-5">
                    <p class="text-center text-muted mb-4">Access your Green Button data</p>

                    <div th:if="${param.error}" class="alert alert-danger" role="alert">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        Sign-in failed. Please try again.
                    </div>

                    <div th:if="${param.logout}" class="alert alert-success" role="alert">
                        <i class="bi bi-check-circle-fill"></i>
                        You have been logged out successfully.
                    </div>

                    <div class="d-grid gap-2 mb-4">
                        <a th:href="@{/oauth2/authorization/datacustodian}" class="btn btn-primary btn-lg">
                            <i class="bi bi-shield-lock"></i>
                            Sign in with Data Custodian
                        </a>
                    </div>

                    <div class="text-center border-top pt-3">
                        <small class="text-muted">
                            Secure OAuth2 authentication with your Green Button Data Custodian
                        </small>
                    </div>
                </div>
            </section>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
